<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6d6b65; --line: #e4e2db;
    --accent: #d2581f; --accent-soft: #fbe7dc; --left: #2f6fb3; --right: #d2581f; --both: #3a8a5a;
    --heat0: #ebe9e2; --heat1: #9fd1b0; --heat2: #3a8a5a; --run: #2f6fb3; --run-soft: #dce8f6;
    --good: #2e7a4c; --good-soft: #dff1e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --card: #1f1f1d; --ink: #f1efe8; --muted: #9c9a92; --line: #33322f;
      --accent: #f07a3f; --accent-soft: #3a2519; --left: #6ea6e6; --right: #f07a3f; --both: #63bb85;
      --heat0: #2a2a27; --heat1: #2f5c40; --heat2: #63bb85; --run: #6ea6e6; --run-soft: #1f2e40;
      --good: #7fd09f; --good-soft: #1f3a29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .date { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .days { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .days button { flex: 1; min-width: 40px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 6px 0; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .days button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .days button.today:not(.on) { color: var(--accent); border-color: var(--accent); }
  .focus { font-size: 20px; font-weight: 700; margin: 0; }
  .note { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .ex { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .ex-name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .ex-name small { color: var(--muted); font-weight: 400; }
  .targets { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .target { flex: 1; min-width: 120px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
  .target .side { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .target .big { font: 500 22px "JetBrains Mono", monospace; }
  .target .last { font-size: 12px; color: var(--muted); }
  .cue { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; }
  .stat .v { font: 500 24px "JetBrains Mono", monospace; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .chart { padding: 14px 14px 8px; min-width: 0; }
  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .chart-name { font-weight: 600; }
  .chart-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chart-now { text-align: right; white-space: nowrap; }
  .chart-now .v { font: 500 20px "JetBrains Mono", monospace; line-height: 1.2; }
  .chart-now .v small { font-size: 12px; color: var(--muted); font-family: Inter, sans-serif; }
  .chart-now .side-v { font: 500 15px "JetBrains Mono", monospace; line-height: 1.35; }
  .chart-now .side-v b { font: 600 11px Inter, sans-serif; letter-spacing: .05em; margin-right: 4px; }
  .delta { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-top: 4px; }
  .delta.up { background: var(--good-soft); color: var(--good); }
  .delta.flat, .delta.down { background: var(--heat0); color: var(--muted); }
  .chart-plot { margin-top: 6px; }
  .chart-first { font-size: 13px; color: var(--muted); padding: 10px 0 8px; }
  .legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 4px 0 8px; }
  .legend > span { white-space: nowrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  svg { display: block; overflow: visible; }
  svg text { fill: var(--muted); font: 11px Inter, sans-serif; }
  svg text.pt { font: 500 11px "JetBrains Mono", monospace; }
  svg text.pt.last { fill: var(--ink); font-weight: 600; font-size: 12px; }
  .heat { display: grid; grid-auto-flow: column; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(7, auto); gap: 3px; }
  .heat div { aspect-ratio: 1; border-radius: 3px; background: var(--heat0); }
  .heat div.l1 { background: var(--heat1); } .heat div.l2 { background: var(--heat2); }
  .heat div.future { background: transparent; }
  .heat div.run { background: var(--run); }
  .heat div.both { background: linear-gradient(135deg, var(--heat2) 50%, var(--run) 50%); }
  .heat-key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .heat-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .goal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .goal-head .v { font: 500 26px "JetBrains Mono", monospace; line-height: 1.15; }
  .goal-head .v small { font: 14px Inter, sans-serif; color: var(--muted); }
  .goal-head .l { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .goal-bar { height: 8px; border-radius: 999px; background: var(--heat0); margin: 12px 0 4px; position: relative; overflow: hidden; }
  .goal-bar span { position: absolute; inset: 0 auto 0 0; background: var(--run); border-radius: 999px; }
  .goal-bar em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .run-sub { font-size: 13px; font-weight: 600; margin: 14px 0 2px; }
  .hist .s.run { color: var(--run); }
  .hist { list-style: none; margin: 0; padding: 0; }
  .hist li { border-top: 1px solid var(--line); padding: 10px 0; }
  .hist li:first-child { border-top: 0; padding-top: 0; }
  .hist .h { display: flex; justify-content: space-between; font-weight: 600; }
  .hist .h span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .hist .s { font-size: 13px; color: var(--muted); font-family: "JetBrains Mono", monospace; }
  .vol-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .vol-head .v { font: 500 26px "JetBrains Mono", monospace; }
  .vol-head .l { font-size: 12px; color: var(--muted); }
  .vol-head .d { font-size: 13px; color: var(--muted); text-align: right; }
  .vol-detail { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
  .vd-title { font-weight: 600; margin-bottom: 6px; }
  .vd-title span { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .vd-g { padding: 6px 0; }
  .vd-gh { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
  .vd-gh i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .vd-ex { display: flex; justify-content: space-between; font-size: 14px; padding-left: 16px; margin-top: 2px; }
  .vd-sets { font: 12px "JetBrains Mono", monospace; color: var(--muted); padding-left: 16px; }
  .vd-n { font-family: "JetBrains Mono", monospace; color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-size: 14px; }
  .err { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Lift Log</h1>
    <div class="date" id="date"></div>
  </header>

  <div class="days" id="days"></div>
  <section class="card" id="today"><p class="empty">Loading…</p></section>

  <h2>This week</h2>
  <section class="card stats" id="stats"></section>

  <h2>Running</h2>
  <section class="card" id="running"></section>

  <h2>Daily volume</h2>
  <section class="card" id="volume"></section>

  <h2>Progress</h2>
  <section class="charts" id="charts"></section>

  <h2>Last 12 weeks</h2>
  <section class="card"><div class="heat" id="heat"></div><div class="heat-key"><span><i style="background:var(--heat2)"></i>Gym</span><span><i style="background:var(--run)"></i>Run</span><span><i style="background:linear-gradient(135deg,var(--heat2) 50%,var(--run) 50%)"></i>Both</span></div></section>

  <h2>History</h2>
  <section class="card"><ul class="hist" id="hist"></ul></section>
</main>

<script>
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmt = s => parseDate(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i+1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const [head, ...body] = rows.filter(r => r.some(x => x.trim()));
  return body.map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? "").trim()])));
}

async function load() {
  const bust = `?t=${Date.now()}`;
  const [lifts, sessions, plan, runs] = await Promise.all([
    fetch("data/lifts.csv" + bust).then(r => r.text()).then(parseCSV),
    fetch("data/sessions.csv" + bust).then(r => r.text()).then(parseCSV),
    fetch("data/plan.json" + bust).then(r => r.json()),
    fetch("data/runs.csv" + bust).then(r => r.ok ? r.text() : "").then(t => t ? parseCSV(t) : []).catch(() => []),
  ]);
  lifts.forEach(r => { r.weight = Number(r.weight); r.reps = Number(r.reps); });
  runs.forEach(r => { r.mi = Number(r.distance_mi) || 0; r.min = Number(r.moving_min) || 0; });
  return { lifts, sessions, plan, runs };
}

// Top set for an exercise/side on a given date: heaviest weight, best reps at it.
function topSet(rows) {
  return rows.reduce((b, r) => (!b || r.weight > b.weight || (r.weight === b.weight && r.reps > b.reps)) ? r : b, null);
}

function suggestion(lifts, name, side, cfg) {
  const rows = lifts.filter(r => r.exercise === name && r.side === side);
  if (!rows.length) return null;
  const last = rows.map(r => r.date).sort().at(-1);
  const top = topSet(rows.filter(r => r.date === last));
  const hit = top.reps >= cfg.targetReps;
  if (cfg.next) {
    const w = cfg.next.bySide && cfg.next.bySide[side] != null ? cfg.next.bySide[side] : cfg.next.weight;
    if (w != null) return { last, top, next: w, hit, override: cfg.next.reason || "set by coach" };
  }
  return { last, top, next: hit ? top.weight + cfg.step : top.weight, hit };
}

function renderToday(data, dayKey, isToday) {
  const { plan, lifts } = data, units = plan.units;
  const day = plan.rotation[dayKey];
  let html = `<p class="focus">${isToday ? "Today · " : dayKey + " · "}${esc(day.focus)}</p>`;
  if (day.note) html += `<p class="note">${esc(day.note)}</p>`;
  if (!day.exercises.length) html += `<p class="note">No machines today.</p>`;
  for (const name of day.exercises) {
    const cfg = plan.exercises[name] || { sides: ["both"], targetReps: 5, sets: 2, step: 5 };
    const u = cfg.unit || units;
    html += `<div class="ex"><div class="ex-name">${esc(name)}<small>${cfg.sets} × ${cfg.targetReps}${cfg.unit === "s" ? " s" : ""}</small></div><div class="targets">`;
    for (const side of cfg.sides) {
      const s = suggestion(lifts, name, side, cfg);
      const label = side === "both" ? "Target" : side === "L" ? "Left" : "Right";
      html += s
        ? `<div class="target"><div class="side">${label}</div><div class="big">${s.next} ${u}</div>
           <div class="last">Last ${s.top.weight}×${s.top.reps} · ${fmt(s.last)}${s.override ? " → " + esc(s.override) : s.hit ? " → up " + cfg.step : " → repeat"}</div></div>`
        : `<div class="target"><div class="side">${label}</div><div class="big">—</div><div class="last">${esc(cfg.start || "No history yet")}</div></div>`;
    }
    html += `</div>${cfg.cue ? `<div class="cue">${esc(cfg.cue)}</div>` : ""}</div>`;
  }
  document.getElementById("today").innerHTML = html;
}

function renderDays(data) {
  const todayKey = DAYS[new Date().getDay()];
  const order = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const el = document.getElementById("days");
  const pick = k => {
    [...el.children].forEach(b => b.classList.toggle("on", b.dataset.k === k));
    renderToday(data, k, k === todayKey);
  };
  el.innerHTML = order.map(k => `<button data-k="${k}" class="${k === todayKey ? "today" : ""}">${k}</button>`).join("");
  el.onclick = e => { const k = e.target.dataset?.k; if (k) pick(k); };
  pick(todayKey);
}

function weekStart(d) { const x = new Date(d); const off = (x.getDay() + 6) % 7; x.setDate(x.getDate() - off); x.setHours(0,0,0,0); return x; }

// Rough calorie estimate per gym day: MET × body weight (kg) × hours. Missing minutes count as the default.
function caloriesByDay({ lifts, sessions, plan, runs = [] }) {
  const cfg = plan.calories, kg = (plan.bodyweightLb || 0) * 0.4536, out = {};
  if (!cfg || !kg) return out;
  const dates = new Set([...lifts.map(r => r.date), ...sessions.map(s => s.date)]);
  dates.forEach(d => {
    const ss = sessions.filter(s => s.date === d);
    const focus = ss[0]?.focus || "";
    const known = ss.some(s => Number(s.minutes));
    const mins = known ? ss.reduce((a, s) => a + Number(s.minutes || 0), 0) : cfg.defaultMinutes;
    const met = cfg.met[focus] ?? cfg.met.default;
    out[d] = { kcal: met * kg * mins / 60, gym: met * kg * mins / 60, run: 0, estimatedTime: !known };
  });
  const perKgKm = cfg.runKcalPerKgKm || 1.036;
  runs.forEach(r => {
    const c = (out[r.date] ||= { kcal: 0, gym: 0, run: 0 });
    const k = perKgKm * kg * r.mi * 1.609344;
    c.run += k; c.kcal += k;
  });
  return out;
}

function renderStats({ lifts, sessions, plan, runs }) {
  const ws = weekStart(new Date());
  const inWeek = s => parseDate(s) >= ws;
  const days = new Set([...lifts.map(r => r.date), ...sessions.map(s => s.date)].filter(inWeek));
  const hipDays = new Set(sessions.filter(s => inWeek(s.date) && /hip/i.test(s.focus)).map(s => s.date));
  const mins = sessions.filter(s => inWeek(s.date)).reduce((a, s) => a + Number(s.minutes || 0), 0);
  const cal = caloriesByDay({ lifts, sessions, plan, runs });
  const kcal = Object.entries(cal).filter(([d]) => inWeek(d)).reduce((a, [, c]) => a + c.kcal, 0);
  const miles = runs.filter(r => inWeek(r.date)).reduce((a, r) => a + r.mi, 0);
  document.getElementById("stats").innerHTML = [
    [days.size + "/6", "gym days"], [hipDays.size + "/3", "hip days"], [mins, "gym minutes"],
    [miles.toFixed(1), "miles run"], [runs.filter(r => inWeek(r.date)).length, "runs"], ["~" + lb(kcal), "kcal (est.)"]
  ].map(([v, l]) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

// Charts are drawn at the container's real pixel width so text stays readable on a phone.
function niceDomain(ys) {
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max(8, (hi - lo) * 0.25);
  return [Math.max(0, lo - pad), hi + pad];
}

function lineChart(series, unit, W) {
  const H = 120, P = { l: 6, r: 6, t: 20, b: 22 };
  const pts = series.flatMap(s => s.points);
  const dates = [...new Set(pts.map(p => p.date))].sort();
  const [lo, hi] = niceDomain(pts.map(p => p.y));
  const t0 = parseDate(dates[0]).getTime(), t1 = parseDate(dates.at(-1)).getTime();
  const padX = 22;
  const x = d => t1 === t0 ? W / 2 : P.l + padX + (parseDate(d).getTime() - t0) / (t1 - t0) * (W - P.l - P.r - 2 * padX);
  const y = v => P.t + (hi - v) / (hi - lo) * (H - P.t - P.b);
  const multi = series.length > 1;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  svg += `<line x1="0" x2="${W}" y1="${H - P.b}" y2="${H - P.b}" stroke="var(--line)"/>`;
  const ticks = dates.length <= 4 ? dates : [dates[0], dates.at(-1)];
  ticks.forEach((d, i) => {
    const anchor = ticks.length > 1 && i === 0 ? "start" : ticks.length > 1 && i === ticks.length - 1 ? "end" : "middle";
    const tx = anchor === "start" ? Math.max(0, x(d) - 14) : anchor === "end" ? Math.min(W, x(d) + 14) : x(d);
    svg += `<text x="${tx}" y="${H - 6}" text-anchor="${dates.length <= 4 ? "middle" : anchor}">${fmt(d)}</text>`;
  });
  series.forEach((s, si) => {
    const p = [...s.points].sort((a, b) => a.date < b.date ? -1 : 1);
    const line = p.map(q => `${x(q.date)},${y(q.y)}`).join(" ");
    if (!multi && p.length > 1) {
      const gid = "g" + Math.random().toString(36).slice(2, 8);
      svg += `<defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>`;
      svg += `<polygon fill="url(#${gid})" points="${x(p[0].date)},${H - P.b} ${line} ${x(p.at(-1).date)},${H - P.b}"/>`;
    }
    const sw = multi ? (s.side === "L" ? 6 : 2.5) : 2.5;
    if (p.length > 1) svg += `<polyline fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-opacity="${multi && s.side === "L" ? .55 : 1}" stroke-linejoin="round" stroke-linecap="round" points="${line}"/>`;
    p.forEach((q, i) => {
      const isLast = i === p.length - 1;
      const r = (isLast ? 5 : 3.5) + (multi && s.side === "L" ? 2.5 : 0);
      svg += `<circle cx="${x(q.date)}" cy="${y(q.y)}" r="${r}" fill="${isLast ? s.color : "var(--card)"}" stroke="${s.color}" stroke-width="2"><title>${fmt(q.date)}: ${q.y} ${unit} × ${q.reps}</title></circle>`;
      // Single series: label every point. Two sides: label only where they differ, above for the higher one.
      const other = multi ? series[1 - si].points.find(o => o.date === q.date) : null;
      if (multi && other && other.y === q.y && si === 1) return;
      const below = multi && other && q.y < other.y;
      svg += `<text class="pt${isLast ? " last" : ""}" x="${x(q.date)}" y="${below ? y(q.y) + 17 : y(q.y) - 9}" text-anchor="middle">${q.y}</text>`;
    });
  });
  return svg + `</svg>`;
}

const SIDE_COLORS = { L: "var(--left)", R: "var(--right)", both: "var(--both)" };
const SIDE_LABELS = { L: "Left", R: "Right", both: "Both" };

function exerciseSeries(lifts, name) {
  const rows = lifts.filter(r => r.exercise === name);
  const sides = ["L", "R", "both"].filter(sd => rows.some(r => r.side === sd));
  return sides.map(side => {
    const byDate = {};
    rows.filter(r => r.side === side).forEach(r => (byDate[r.date] ||= []).push(r));
    const points = Object.entries(byDate).map(([date, rs]) => { const t = topSet(rs); return { date, y: t.weight, reps: t.reps }; })
      .sort((a, b) => a.date < b.date ? -1 : 1);
    return { side, color: SIDE_COLORS[side] || "var(--accent)", points };
  });
}

function renderCharts({ lifts, plan }) {
  const el = document.getElementById("charts");
  // Plan order first (priority lifts at the top), then anything else that was logged.
  const logged = new Set(lifts.map(r => r.exercise));
  const names = [...Object.keys(plan.exercises).filter(n => logged.has(n)), ...[...logged].filter(n => !plan.exercises[n])];
  if (!names.length) { el.innerHTML = `<div class="card empty">No lifts logged yet.</div>`; return; }
  el.innerHTML = names.map((name, i) => {
    const series = exerciseSeries(lifts, name);
    const unit = plan.exercises[name]?.unit || plan.units;
    const allDates = [...new Set(series.flatMap(s => s.points.map(p => p.date)))].sort();
    const lastOf = s => s.points.at(-1);
    let now;
    if (series.length > 1) {
      now = series.map(s => `<div class="side-v" style="color:${s.color}"><b>${s.side}</b>${lastOf(s).y}<small style="color:var(--muted);font:12px Inter"> ×${lastOf(s).reps}</small></div>`).join("");
    } else {
      const l = lastOf(series[0]);
      now = `<div class="v">${l.y}<small> ${unit} × ${l.reps}</small></div>`;
    }
    // Change since the first session, using the stronger side.
    const firstBest = Math.max(...series.map(s => s.points[0].y));
    const lastBest = Math.max(...series.map(s => lastOf(s).y));
    const d = lastBest - firstBest;
    const delta = allDates.length < 2 ? "" :
      `<span class="delta ${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${Math.abs(d)} ${unit} since ${fmt(allDates[0])}</span>`;
    const sub = `${allDates.length} session${allDates.length === 1 ? "" : "s"} · top set`;
    const plot = allDates.length < 2
      ? `<div class="chart-first">First session ${fmt(allDates[0])}. The line starts next time.</div>`
      : `<div class="chart-plot" data-i="${i}"></div>`;
    return `<div class="card chart"><div class="chart-head"><div><div class="chart-name">${esc(name)}</div><div class="chart-sub">${sub}</div>${delta}</div><div class="chart-now">${now}</div></div>${plot}</div>`;
  }).join("");
  const draw = () => el.querySelectorAll(".chart-plot").forEach(div => {
    const name = names[+div.dataset.i];
    const W = Math.floor(div.clientWidth);
    if (W > 0) div.innerHTML = lineChart(exerciseSeries(lifts, name), plan.exercises[name]?.unit || plan.units, W);
  });
  draw();
  onResize(draw);
}

const resizeFns = [];
function onResize(fn) { resizeFns.push(fn); }
let lastW = window.innerWidth;
window.addEventListener("resize", () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; resizeFns.forEach(f => f()); } });

function renderHeat({ lifts, sessions, runs }) {
  const dayMins = {}, runMi = {};
  sessions.forEach(s => dayMins[s.date] = (dayMins[s.date] || 0) + Number(s.minutes || 0));
  lifts.forEach(r => dayMins[r.date] ??= 1);
  runs.forEach(r => runMi[r.date] = (runMi[r.date] || 0) + r.mi);
  const today = new Date(); today.setHours(0,0,0,0);
  const start = weekStart(today); start.setDate(start.getDate() - 7 * 11);
  let html = "";
  for (let i = 0; i < 84; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const m = dayMins[iso(d)], mi = runMi[iso(d)];
    const cls = d > today ? "future" : m && mi ? "both" : mi ? "run" : m ? (m >= 7 ? "l2" : "l1") : "";
    const tip = [iso(d), m > 1 ? m + " min gym" : m ? "gym" : "", mi ? mi.toFixed(1) + " mi" : ""].filter(Boolean).join(" · ");
    html += `<div class="${cls}" title="${tip}"></div>`;
  }
  document.getElementById("heat").innerHTML = html;
}


// Muscle groups in a fixed order (legs first), each with its own colour.
const GROUPS = [
  ["Quads & glutes", "#d2581f"], ["Hips", "#2f6fb3"], ["Hamstrings", "#a3489a"], ["Calves", "#3a8a5a"],
  ["Core", "#4f8f9e"], ["Chest", "#c4952b"], ["Shoulders", "#7a6a5a"], ["Back", "#5a5fc4"], ["Other", "#8a8780"],
];
const groupOf = (plan, ex) => plan.exercises[ex]?.group || "Other";
const groupColor = g => (GROUPS.find(x => x[0] === g) || GROUPS.at(-1))[1];

// Volume = weight x reps for every weighted set. Timed holds (unit "s") don't count.
function volumeByDay({ lifts, plan }) {
  const days = {};
  lifts.filter(r => plan.exercises[r.exercise]?.unit !== "s").forEach(r => {
    const d = (days[r.date] ||= { total: 0, ex: {}, groups: {} });
    const v = r.weight * r.reps, g = groupOf(plan, r.exercise);
    d.total += v; d.ex[r.exercise] = (d.ex[r.exercise] || 0) + v; d.groups[g] = (d.groups[g] || 0) + v;
  });
  return days;
}
const lb = n => Math.round(n).toLocaleString();

let volSelected = null;
function renderVolume(data) {
  const days = volumeByDay(data), el = document.getElementById("volume");
  const dates = Object.keys(days).sort().slice(-20);
  if (!dates.length) { el.innerHTML = `<p class="empty">No lifts logged yet.</p>`; return; }
  if (!dates.includes(volSelected)) volSelected = dates.at(-1);
  const last = dates.at(-1), prev = dates.at(-2);
  const delta = prev ? days[last].total - days[prev].total : null;
  const groups = GROUPS.map(g => g[0]).filter(g => dates.some(d => days[d].groups[g]));
  const W = Math.max(240, Math.floor(el.clientWidth - 32)), H = 160, P = { l: 34, r: 4, t: 10, b: 22 };
  const max = Math.max(...dates.map(d => days[d].total));
  const step = Math.pow(10, Math.floor(Math.log10(max))) / 2;
  const top = Math.ceil(max * 1.1 / step) * step;
  const slot = (W - P.l - P.r) / Math.max(dates.length, 6);
  const bw = Math.min(36, slot * 0.7);
  const y = v => P.t + (1 - v / top) * (H - P.t - P.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  for (const v of [0, top / 2, top]) svg += `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${v >= 1000 ? (v/1000).toFixed(v % 1000 ? 1 : 0) + "k" : v}</text>`;
  const every = Math.ceil(dates.length / Math.max(2, Math.floor((W - P.l) / 52)));
  dates.forEach((d, i) => {
    const cx = P.l + slot * (i + 0.5), on = d === volSelected; let acc = 0;
    svg += `<g class="vbar" data-d="${d}" style="cursor:pointer" opacity="${on ? 1 : .45}">`;
    svg += `<rect x="${cx - slot/2}" y="${P.t}" width="${slot}" height="${H - P.t - P.b}" fill="transparent"/>`;
    groups.forEach(g => {
      const v = days[d].groups[g]; if (!v) return;
      svg += `<rect x="${cx - bw/2}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${groupColor(g)}"><title>${fmt(d)} · ${esc(g)}: ${lb(v)} lb</title></rect>`;
      acc += v;
    });
    svg += `</g>`;
    if (on) svg += `<rect x="${cx - bw/2 - 3}" y="${y(acc) - 3}" width="${bw + 6}" height="${y(0) - y(acc) + 3}" fill="none" stroke="var(--ink)" stroke-width="1.5" rx="3" pointer-events="none"/>`;
    if (i % every === 0 || i === dates.length - 1 || on) svg += `<text x="${cx}" y="${H-6}" text-anchor="middle"${on ? ' style="fill:var(--ink);font-weight:600"' : ""}>${fmt(d)}</text>`;
  });
  svg += `</svg>`;
  const legend = `<span class="legend">${groups.map(g => `<span><i style="background:${groupColor(g)}"></i>${esc(g)}</span>`).join("")}</span>`;

  // Detail for the selected day: muscle groups, then the exercises in each.
  const sd = days[volSelected];
  const rows = data.lifts.filter(r => r.date === volSelected);
  const detail = GROUPS.map(g => g[0]).filter(g => sd.groups[g]).map(g => {
    const exs = Object.keys(sd.ex).filter(ex => groupOf(data.plan, ex) === g).map(ex => {
      const sets = rows.filter(r => r.exercise === ex).map(r => `${r.side !== "both" ? r.side + " " : ""}${r.weight}×${r.reps}`).join(", ");
      return `<div class="vd-ex"><span>${esc(ex)}</span><span class="vd-n">${lb(sd.ex[ex])}</span></div><div class="vd-sets">${sets}</div>`;
    }).join("");
    return `<div class="vd-g"><div class="vd-gh"><span><i style="background:${groupColor(g)}"></i>${esc(g)}</span><span class="vd-n">${lb(sd.groups[g])} lb</span></div>${exs}</div>`;
  }).join("");

  el.innerHTML = `<div class="vol-head"><div><div class="v">${lb(days[last].total)} lb</div><div class="l">last session · ${fmt(last)}</div></div>
    <div class="d">${delta === null ? "" : (delta >= 0 ? "+" : "−") + lb(Math.abs(delta)) + " lb vs " + fmt(prev)}</div></div>${legend}${svg}
    <div class="vol-detail"><div class="vd-title">${fmt(volSelected)} · ${lb(sd.total)} lb <span>tap a bar to see another day</span></div>${detail}</div>`;
  el.querySelectorAll(".vbar").forEach(b => b.addEventListener("click", () => { volSelected = b.dataset.d; renderVolume(data); }));
}

const pace = r => { if (!r.mi || !r.min) return ""; const p = r.min / r.mi; return `${Math.floor(p)}:${String(Math.round((p % 1) * 60)).padStart(2, "0")}/mi`; };

function renderHistory({ lifts, sessions, plan, runs }) {
  const dates = [...new Set([...lifts.map(r => r.date), ...sessions.map(s => s.date), ...runs.map(r => r.date)])].sort().reverse().slice(0, 15);
  const el = document.getElementById("hist");
  if (!dates.length) { el.innerHTML = `<li class="empty">Nothing yet.</li>`; return; }
  const vol = volumeByDay({ lifts, plan });
  const cal = caloriesByDay({ lifts, sessions, plan, runs });
  el.innerHTML = dates.map(d => {
    const s = sessions.find(x => x.date === d);
    const rows = lifts.filter(r => r.date === d);
    const byEx = {};
    rows.forEach(r => (byEx[r.exercise] ||= []).push(r));
    const lines = Object.entries(byEx).map(([ex, rs]) => {
      const sides = [...new Set(rs.map(r => r.side))];
      const sets = sides.length > 1 && sides.every(sd => rs.filter(r => r.side === sd).map(r => r.weight + "×" + r.reps).join() === rs.filter(r => r.side === sides[0]).map(r => r.weight + "×" + r.reps).join())
        ? rs.filter(r => r.side === sides[0]).map(r => `${r.weight}×${r.reps}`).join(", ") + " (each side)"
        : rs.map(r => `${r.side !== "both" ? r.side + " " : ""}${r.weight}×${r.reps}`).join(", ");
      return `<div class="s">${esc(ex)}: ${sets}</div>`;
    }).join("") + runs.filter(r => r.date === d).map(r =>
      `<div class="s run">Run: ${r.mi.toFixed(1)} mi · ${pace(r)}${Number(r.elev_ft) ? ` · ${r.elev_ft} ft up` : ""}</div>`).join("");
    const dayMi = runs.filter(r => r.date === d).reduce((a, r) => a + r.mi, 0);
    return `<li><div class="h">${fmt(d)} · ${esc(s?.focus || (rows.length ? "Lift" : "Run"))}<span>${[dayMi ? dayMi.toFixed(1) + " mi" : "", vol[d] ? lb(vol[d].total) + " lb" : "", s?.minutes ? s.minutes + " min" : "", cal[d] ? "~" + Math.round(cal[d].kcal) + " kcal" : ""].filter(Boolean).join(" · ")}</span></div>${lines}</li>`;
  }).join("");
}

// Running: progress toward the year goal, and weekly miles for the last 12 weeks.
function renderRunning({ runs, plan }) {
  const el = document.getElementById("running");
  const goal = plan.running?.yearGoalMi || 1000;
  if (!runs.length) { el.innerHTML = `<p class="empty">Runs appear here after the first Strava sync.</p>`; return; }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const year = today.getFullYear(), y0 = new Date(year, 0, 1), y1 = new Date(year + 1, 0, 1);
  const yDays = (y1 - y0) / 864e5, dayN = (today - y0) / 864e5 + 1;
  const yr = runs.filter(r => r.date.startsWith(year + "")).sort((a, b) => a.date < b.date ? -1 : 1);
  const total = yr.reduce((a, r) => a + r.mi, 0);
  const onPace = goal * dayN / yDays, diff = total - onPace;
  const left = Math.max(0, goal - total), daysLeft = Math.max(1, yDays - dayN);
  const W = Math.max(240, Math.floor(el.clientWidth - 32));

  // Cumulative miles vs a straight line to the goal.
  const H = 150, P = { l: 4, r: 4, t: 14, b: 22 };
  const x = d => P.l + ((parseDate(d) - y0) / 864e5) / yDays * (W - P.l - P.r);
  const yy = v => P.t + (1 - v / goal) * (H - P.t - P.b);
  let acc = 0, pts = [`${x(iso(y0))},${yy(0)}`];
  yr.forEach(r => { acc += r.mi; pts.push(`${x(r.date)},${yy(acc)}`); });
  pts.push(`${x(iso(today))},${yy(acc)}`);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy(0)}" y2="${yy(0)}" stroke="var(--line)"/>`;
  svg += `<line x1="${x(iso(y0))}" y1="${yy(0)}" x2="${W - P.r}" y2="${yy(goal)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  svg += `<text x="${W - P.r}" y="${yy(goal) - 4}" text-anchor="end">${goal.toLocaleString()} goal</text>`;
  svg += `<polygon fill="var(--run-soft)" points="${x(iso(y0))},${yy(0)} ${pts.join(" ")} ${x(iso(today))},${yy(0)}"/>`;
  svg += `<polyline fill="none" stroke="var(--run)" stroke-width="2.5" stroke-linejoin="round" points="${pts.join(" ")}"/>`;
  svg += `<circle cx="${x(iso(today))}" cy="${yy(total)}" r="5" fill="var(--run)"/>`;
  const lx = x(iso(today)), anchor = lx > W - 60 ? "end" : "middle";
  svg += `<text class="pt last" x="${anchor === "end" ? lx - 8 : lx}" y="${yy(total) - 10}" text-anchor="${anchor}">${Math.round(total)}</text>`;
  ["Jan", "Apr", "Jul", "Oct"].forEach((m, i) => svg += `<text x="${x(iso(new Date(year, i * 3, 1)))}" y="${H - 6}">${m}</text>`);
  svg += `</svg>`;

  // Weekly miles, Monday-start, last 12 weeks; dashed line = weekly miles still needed.
  const ws0 = weekStart(today); const weeks = [];
  for (let i = 11; i >= 0; i--) { const a = new Date(ws0); a.setDate(a.getDate() - 7 * i); weeks.push(a); }
  const wk = weeks.map(a => { const b = new Date(a); b.setDate(b.getDate() + 7); return runs.filter(r => { const d = parseDate(r.date); return d >= a && d < b; }).reduce((s, r) => s + r.mi, 0); });
  const need = left / (daysLeft / 7);
  const H2 = 140, P2 = { l: 4, r: 4, t: 18, b: 22 };
  const top = Math.max(...wk, need) * 1.15 || 1;
  const slot = (W - P2.l - P2.r) / 12, bw = Math.min(26, slot * 0.68);
  const y2 = v => P2.t + (1 - v / top) * (H2 - P2.t - P2.b);
  let svg2 = `<svg viewBox="0 0 ${W} ${H2}" width="${W}" height="${H2}" role="img"><line x1="${P2.l}" x2="${W - P2.r}" y1="${y2(0)}" y2="${y2(0)}" stroke="var(--line)"/>`;
  wk.forEach((m, i) => {
    const cx = P2.l + slot * (i + 0.5), cur = i === 11;
    if (m) svg2 += `<rect x="${cx - bw / 2}" y="${y2(m)}" width="${bw}" height="${y2(0) - y2(m)}" rx="3" fill="var(--run)" opacity="${cur ? 0.55 : 1}"><title>Week of ${fmt(iso(weeks[i]))}: ${m.toFixed(1)} mi</title></rect>`;
    if (m && (i % 2 === 1 || cur || W > 420)) svg2 += `<text class="pt${cur ? " last" : ""}" x="${cx}" y="${y2(m) - 5}" text-anchor="middle">${Math.round(m)}</text>`;
    if (i % 3 === 2 || cur) svg2 += `<text x="${cx}" y="${H2 - 6}" text-anchor="middle">${cur ? "This wk" : fmt(iso(weeks[i]))}</text>`;
  });
  if (left > 0) svg2 += `<line x1="${P2.l}" x2="${W - P2.r}" y1="${y2(need)}" y2="${y2(need)}" stroke="var(--ink)" stroke-dasharray="4 4"/><text x="${P2.l}" y="${y2(need) - 5}" style="fill:var(--ink)">need ${need.toFixed(1)}/wk</text>`;
  svg2 += `</svg>`;

  const status = left <= 0 ? `Goal reached` : `${Math.abs(diff).toFixed(1)} mi ${diff >= 0 ? "ahead of" : "behind"} pace · ${(left / daysLeft).toFixed(1)} mi/day to finish`;
  el.innerHTML = `<div class="goal-head"><div><div class="v">${total.toFixed(1)}<small> of ${goal.toLocaleString()} mi</small></div><div class="l">${status}</div></div></div>
    <div class="goal-bar"><span style="width:${Math.min(100, total / goal * 100)}%"></span><em style="left:${Math.min(100, onPace / goal * 100)}%"></em></div>
    <div class="run-sub">${year} so far</div>${svg}<div class="run-sub">Weekly miles</div>${svg2}`;
}

document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
load().then(data => {
  renderDays(data); renderStats(data); renderRunning(data); onResize(() => renderRunning(data)); renderVolume(data); onResize(() => renderVolume(data)); renderCharts(data); renderHeat(data); renderHistory(data);
}).catch(e => {
  document.getElementById("today").innerHTML = `<p class="err">Couldn't load data: ${esc(e.message)}</p>`;
});
</script>
</body>
</html>
